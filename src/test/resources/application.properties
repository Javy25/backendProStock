# Base H2 efímera para que las pruebas no dependan del servidor MySQL local.
spring.datasource.url=jdbc:h2:mem:prostock_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Desactiva la consola en pruebas y redirige el correo al remitente simulado local.
spring.h2.console.enabled=false
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
app.jwt.secret=ZHVtbXktc2VjcmV0LWtleS1mb3ItdGVzdGluZy0zMi1ieXRlcy1sb25nIQ==
app.security.admin-emails=admin@example.com
app.security.seller-emails=seller@example.com
