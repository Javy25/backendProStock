# Configuración de la conexión a MySQL; las credenciales se obtienen del entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/prostock_bd?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de persistencia y generación del esquema mediante Hibernate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ID de cliente OAuth esperado al validar credenciales de Google.
google.client-id=${GOOGLE_CLIENT_ID:}
app.jwt.secret=${APP_JWT_SECRET:}
app.security.admin-emails=${ADMIN_EMAILS:}
app.security.seller-emails=${SELLER_EMAILS:}

# Rutas de documentación Swagger UI y OpenAPI JSON.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Configuración del correo saliente; la contraseña se lee del entorno o del archivo local excluido.
spring.config.import=optional:classpath:secrets-local.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:notificaciones.prostock@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Configuración del servidor HTTP y su dirección de escucha.
server.port=8080
server.address=${SERVER_ADDRESS:0.0.0.0}
# Mantiene la consola H2 inaccesible desde otros equipos.
spring.h2.console.settings.web-allow-others=false
